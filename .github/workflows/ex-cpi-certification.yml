name: EX-CPI certification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q -W ignore::DeprecationWarning
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m mypy
      - run: python -m compileall -q main.py scripts tests

  live-ons:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ONS_LIVE_TEST: '1'
      COLLECTOR_DOWNLOAD_DELAY: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest tests/test_live_source.py tests/test_live_history.py -q -s | tee live-ons.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-ons-evidence
          path: live-ons.log

  postgresql:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: collector
          POSTGRES_PASSWORD: collector
          POSTGRES_DB: collector
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      COLLECTOR_DB_URL: postgresql+psycopg2://collector:collector@localhost:5432/collector
      COLLECTOR_DOWNLOAD_DELAY: '0'
      POSTGRES_TEST_URL: postgresql+psycopg2://collector:collector@localhost:5432/collector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest tests/test_postgresql_transaction.py -q -s
      - run: python -m scripts.init_db
      - run: python main.py --no-watch | tee postgresql-run-1.log
      - run: python main.py --no-watch | tee postgresql-run-2.log
      - name: Assert second-run no-op
        run: >-
          grep -F 'Run result: observations=0 vintages=0 official_weights=0 weight_vintages=0 metadata_inserted=0 metadata_updated=0'
          postgresql-run-2.log
      - name: Record database counts
        run: >-
          psql postgresql://collector:collector@localhost:5432/collector -v ON_ERROR_STOP=1 -c
          "SELECT
          (SELECT COUNT(*) FROM collector_ons_ex_cpi.metadata) AS metadata_count,
          (SELECT COUNT(*) FROM collector_ons_ex_cpi.time_series) AS time_series_count,
          (SELECT COUNT(*) FROM collector_ons_ex_cpi.original_weights) AS original_weights_count,
          (SELECT COUNT(*) FROM collector_ons_ex_cpi.logs) AS logs_count,
          (SELECT MIN(reference_date) FROM collector_ons_ex_cpi.time_series) AS first_reference_date,
          (SELECT MAX(reference_date) FROM collector_ons_ex_cpi.time_series) AS last_reference_date;"
          | tee postgresql-counts.log
      - name: Assert metadata scope
        run: grep -E '^ *10 *\|' postgresql-counts.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgresql-evidence
          path: |
            postgresql-run-1.log
            postgresql-run-2.log
            postgresql-counts.log
